# =============================================================================
# Validação da base publicada
# =============================================================================
# Três verificações, com exigências de credencial diferentes — e por isso em
# jobs separados, para que a ausência de um segredo não derrube o que não
# depende dele.
#
#   dados     invariantes da base publicada (âncoras oficiais, conciliação
#             entre marts, integridade dimensional). Só API pública: qualquer
#             pessoa reproduz.
#   camadas   coerência entre manifesto, Storage, Postgres e sdata. Precisa da
#             chave de serviço para ler o OpenAPI do PostgREST.
#   esquema   o schema.sql versionado ainda corresponde ao banco. Detecta DDL
#             aplicado sem versionar — que foi como 47 das 57 migrações em
#             produção surgiram sem arquivo no repositório.
# =============================================================================
name: Validação dos dados

on:
  schedule:
    - cron: "23 7 2 * *"   # mensal
  workflow_dispatch:
  push:
    paths:
      - "scripts/validate_data.py"
      - "scripts/validar_camadas.py"
      - "scripts/gerar_schema.py"
      - "scripts/reconstruir.py"
      - "scripts/_publicacao.py"
      - "data/publicacoes/**"
      - "migrations/schema/**"
      - ".github/workflows/validate-data.yml"

jobs:
  dados:
    name: Invariantes da base publicada
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/validate_data.py

  camadas:
    name: Coerência entre camadas
    runs-on: ubuntu-latest
    # `env` no nível do JOB, não do passo: a expressão `if` de um passo não
    # enxerga o `env` declarado nesse mesmo passo.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests pandas pyarrow

      # Roda SEM segredo nenhum: quatro das cinco checagens usam só a chave
      # pública de leitura, que já é embutida em validate_data.py e no site. A
      # quinta (cobertura API × publicação) exige a chave de serviço e se
      # anuncia como PULADA quando ela falta — nunca passa em silêncio.
      - name: Conferir manifesto × Storage × Postgres × sdata
        run: python scripts/validar_camadas.py

      - name: Avisar que a cobertura não foi verificada
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY == '' }}
        run: echo "::warning::SUPABASE_SERVICE_ROLE_KEY ausente — a checagem de COBERTURA (tabela servida sem arquivo publicado) não rodou"

  esquema:
    # O nome descreve o JOB, não o resultado. "schema.sql corresponde ao banco"
    # aparecia com ✓ mesmo quando a checagem era pulada por falta de segredo --
    # um check verde afirmando algo que não foi verificado, que é o mesmo
    # defeito de validate_data.py e alertas-envio corrigido nesta série.
    name: Esquema e tamanho do banco (exige chave de serviço)
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # gerar_schema.py importa _publicacao, que importa pandas. Este job viveu
      # PULADO por falta de segredo, entao a dependencia faltando nunca apareceu:
      # job que nao roda nao e job que passa.
      - run: pip install requests pandas pyarrow

      - name: Conferir se schema.sql ainda corresponde ao banco
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: python scripts/gerar_schema.py --conferir

      # O banco foi de 740 MB para 607 MB com VACUUM FULL em 2026-08-23, sem
      # perder uma linha. Ganho de faxina volta: os pipelines fazem upsert e o
      # forecast faz DELETE+INSERT a cada execucao. Medir e o que impede o
      # inchaco de reaparecer em silencio. O limite tem folga proposital sobre
      # os 607 MB atuais -- alarme que toca por variacao normal e alarme que se
      # aprende a ignorar.
      - name: Medir tamanho e inchaço do banco
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: python scripts/diagnostico_banco.py --limite-mb 700

      - name: Avisar quando a chave de serviço não está configurada
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY == '' }}
        run: echo "::warning::SUPABASE_SERVICE_ROLE_KEY ausente — deriva de esquema NÃO foi verificada"

  reconstrucao:
    # A prova de que o repositorio reconstroi o banco. Roda contra um Postgres
    # DESCARTAVEL do proprio runner -- nunca contra producao, e o script recusa
    # destinos que pareçam Supabase gerenciado.
    #
    # Nao precisa de segredo: o schema.sql esta versionado e os Parquet vem do
    # bucket publico. Ou seja, qualquer pessoa reproduz este job.
    name: Reconstruir o banco do zero
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]" pandas pyarrow requests

      - name: Aplicar schema.sql e carregar os Parquet publicados
        run: |
          python scripts/reconstruir.py             --destino postgresql://postgres:postgres@localhost:5432/postgres             --quieto
