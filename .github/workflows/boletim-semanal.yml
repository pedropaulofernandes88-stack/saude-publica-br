# Gera a edição semanal do Boletim Epidemiológico e publica no site.
# Roda toda segunda-feira às 12:00 UTC (09:00 BRT), após as ingestões semanais
# (04:00 BRT). O gerador consulta os marts públicos, grava a edição em
# site/public/sdata/boletins/ e o commit dispara o redeploy do site.
#
# Nota: push feito com GITHUB_TOKEN não dispara workflows on:push — por isso
# o deploy do site é disparado explicitamente via workflow_dispatch.
name: Boletim epidemiológico semanal

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write   # guard-rail: abre/comenta issue quando o boletim sai degradado

concurrency:
  group: boletim-semanal
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    # Declarado no JOB, não no passo: a condição `if:` de um passo é avaliada
    # ANTES do `env:` daquele passo existir, então `env.X != ''` dentro do
    # próprio passo é sempre falso — o envio ficaria pulado em silêncio.
    env:
      ALERTAS_ENVIO_SECRET: ${{ secrets.ALERTAS_ENVIO_SECRET }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://zekjhmxjamatlxpkykde.supabase.co' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          # 24, nao 20: build-boletim.mjs importa site/lib/completude.ts, e type
          # stripping exige Node 22.6+ (padrao do 23 em diante). Sem isto o cron
          # semanal quebraria em producao. O Node 20 tambem saiu do suporte em
          # abril/2026.
          node-version: "24"

      # Sai com 2 quando a edição foi produzida mas está degradada (fonte fora
      # do ar, modelo congelado, mart vazia). Publicamos assim mesmo — a página
      # mostra a degradação — e derrubamos o job no fim, para notificar.
      - name: Gerar edição da semana
        id: gerar
        continue-on-error: true
        run: |
          set +e
          node site/scripts/build-boletim.mjs 2>&1 | tee /tmp/boletim.log
          CODIGO=${PIPESTATUS[0]}
          echo "codigo=${CODIGO}" >> "$GITHUB_OUTPUT"
          # Só o código 2 é degradação recuperável; qualquer outro erro é fatal.
          if [ "$CODIGO" -ne 0 ] && [ "$CODIGO" -ne 2 ]; then exit "$CODIGO"; fi

      - name: Apurar o que mudou desde a edição anterior
        run: node site/scripts/build-alertas.mjs

      # Canal de entrega que não depende de provedor de e-mail: arquivo estático,
      # sem credencial e sem base de dados pessoais.
      - name: Publicar feeds Atom
        run: node site/scripts/build-feed.mjs

      - name: Commit e push (se houver edição nova)
        id: commit
        run: |
          git config user.name "boletim-bot"
          git config user.email "actions@github.com"
          git add site/public/sdata/boletins/ site/public/boletim.xml site/public/alertas.xml
          if git diff --cached --quiet; then
            echo "Nenhuma mudança — edição já publicada."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            EDICAO=$(node -e "const i=require('./site/public/sdata/boletins/index.json');console.log(i[0].edicao)")
            git commit -m "boletim: edição ${EDICAO} (automático)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Disparar deploy do site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml --ref main --repo "$GITHUB_REPOSITORY"

      # Só dispara se houver ALERTAS_ENVIO_SECRET configurado. O próprio JSON
      # carrega `deve_enviar`: semana sem entrada nem agravamento não gera e-mail,
      # e a Edge Function não reenvia uma edição já entregue.
      - name: Enviar alertas aos assinantes
        if: ${{ env.ALERTAS_ENVIO_SECRET != '' }}
        run: |
          EDICAO=$(node -e "const i=require('./site/public/sdata/boletins/index.json');console.log(i[0].edicao)")
          ARQ="site/public/sdata/boletins/alertas-${EDICAO}.json"
          if [ ! -f "$ARQ" ]; then
            echo "Sem arquivo de alertas para ${EDICAO} — nada a enviar."
            exit 0
          fi
          # -w para separar o status HTTP do corpo: a função agora responde 207
          # (entrega parcial) ou 502 (nenhuma entrega), e não só 200 com ok:false.
          # Antes bastava `grep '"ok":true'` num corpo que era sempre ok:true —
          # o job ficava verde com todos os e-mails falhando.
          RESP=$(curl -sS -w '\n%{http_code}' -X POST "${SUPABASE_URL}/functions/v1/alertas-envio" \
            -H "Content-Type: application/json" \
            -H "x-alertas-secret: ${ALERTAS_ENVIO_SECRET}" \
            --data-binary "@${ARQ}")
          HTTP=$(echo "$RESP" | tail -n1)
          CORPO=$(echo "$RESP" | sed '$d')
          echo "Resposta do envio (HTTP ${HTTP}): ${CORPO}"
          if [ "$HTTP" != "200" ]; then
            echo "::error::envio de alertas retornou HTTP ${HTTP} — ${CORPO}"
            exit 1
          fi
          echo "$CORPO" | grep -q '"ok":true' || {
            echo "::error::envio de alertas não confirmou ok:true — ${CORPO}"; exit 1; }

      # ── Guard-rail ──────────────────────────────────────────────────────
      # Degradação silenciosa é o modo de falha que mata um projeto automatizado:
      # a fonte muda, o boletim continua saindo "plausível" e ninguém percebe por
      # semanas. Aqui ela vira issue aberta e job vermelho.
      - name: Abrir issue se o boletim saiu degradado
        if: steps.gerar.outputs.codigo == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EDICAO=$(node -e "const i=require('./site/public/sdata/boletins/index.json');console.log(i[0].edicao)")
          TITULO="Boletim degradado na edição ${EDICAO}"
          FALHAS=$(node -e "
            const b=require('./site/public/sdata/boletins/${EDICAO}.json');
            const c=(b.verificacoes||[]).filter(v=>!v.ok);
            console.log(c.map(v=>'- '+(v.critico?'**CRÍTICA** ':'')+'\`'+v.nome+'\`: '+v.detalhe).join('\n'));
          ")
          CORPO=$(printf '%s\n\n%s\n\n%s\n' \
            "A edição \`${EDICAO}\` foi publicada, mas com verificações falhando:" \
            "${FALHAS}" \
            "Execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          # Reaproveita a issue aberta, se houver, em vez de abrir uma por semana.
          EXISTENTE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label boletim-degradado --limit 1 --json number -q '.[0].number')
          if [ -n "$EXISTENTE" ]; then
            gh issue comment "$EXISTENTE" --repo "$GITHUB_REPOSITORY" --body "$CORPO"
          else
            gh label create boletim-degradado --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "Boletim publicado com verificações falhando" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITULO" \
              --label boletim-degradado --body "$CORPO"
          fi

      - name: Falhar o job para notificar a degradação
        if: steps.gerar.outputs.codigo == '2'
        run: |
          echo "::error::Boletim publicado em estado degradado — ver issue com rótulo boletim-degradado."
          exit 1
