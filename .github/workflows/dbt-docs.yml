# =============================================================================
# dbt Docs — catálogo do dbt
# =============================================================================
# ATENÇÃO — este workflow NÃO publica mais no GitHub Pages.
#
# O Pages do repositório é de saudeemdado.com, publicado por deploy-site.yml a
# partir de site/out. Os dois workflows chamavam actions/deploy-pages@v4 no
# mesmo ambiente `github-pages`, e o Pages guarda UM deployment por repositório:
# qualquer push em dbt/** substituía o site público inteiro pela documentação do
# dbt. O grupo de concorrência `pages` compartilhado só serializava as duas
# publicações — não impedia a segunda de sobrescrever a primeira.
#
# Agora o catálogo sai como artefato da run (baixável por 14 dias). Para voltar
# a publicá-lo na web sem derrubar o site, o caminho é gerar em site/public/dbt/
# e deixar o deploy-site.yml levar junto, num subdiretório próprio.
# =============================================================================
name: dbt Docs

on:
  push:
    branches: [main]
    paths:
      - "dbt/**"
      - ".github/workflows/dbt-docs.yml"
  workflow_dispatch:   # permite rodar manualmente

permissions:
  contents: read

concurrency:
  group: dbt-docs
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Generate dbt Docs
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt/requirements-dbt.txt

      - name: Install dbt
        run: pip install --upgrade pip && pip install -r dbt/requirements-dbt.txt

      - name: Generate dbt docs
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
          # Os nomes abaixo sao os que dbt/profiles.yml realmente le no target
          # `dev`. Antes o passo exportava SUPABASE_DB/USER/PASSWORD e chamava
          # `--target prod`, que le PROD_DB_HOST, PROD_DB_USER e PROD_DB_PASSWORD:
          # nenhuma das variaveis fornecidas era consultada, e o dbt abortaria em
          # env_var mesmo com as dependencias instaladas.
          #
          # `dev` monta o host como db.<SUPABASE_HOST>, que e o endereco de
          # conexao direta do Supabase, e usa o schema public.
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: |
          dbt deps
          dbt docs generate --profiles-dir . --target dev

      - name: Move docs to publish dir
        run: |
          mkdir -p _site
          cp dbt/target/index.html   _site/
          cp dbt/target/catalog.json _site/
          cp dbt/target/manifest.json _site/
          cp dbt/target/run_results.json _site/ || true
          cp dbt/target/graph.gpickle  _site/ || true

      - name: Publicar catálogo como artefato
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: _site
          retention-days: 14
