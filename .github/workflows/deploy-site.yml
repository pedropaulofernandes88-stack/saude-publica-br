# Build e deploy do site estático (site/) para o GitHub Pages.
# Domínio customizado: saudeemdado.com (arquivo CNAME gerado no build).
name: Deploy site (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Precisa acompanhar o ci.yml: o prebuild importa lib/completude.ts e
          # type stripping exige Node 22.6+ (padrao do 23 em diante).
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build estático
        working-directory: site
        env:
          # Endereço do Cemitério Digital, que roda FORA daqui (o Pages serve
          # arquivo estático; a ferramenta precisa de Python persistente).
          #
          # É uma *variable* de repositório, não um secret: o valor é uma URL
          # pública que vai para o HTML de qualquer jeito. A chave interna do
          # serviço (CEMITERIO_API_KEY) nunca passa por aqui — ela vive só no
          # gateway do servidor que hospeda a ferramenta.
          #
          # Sem a variável, o acesso simplesmente não aparece no menu. Ver
          # site/lib/cemiterio.ts e docs/CEMITERIO_DIGITAL.md.
          NEXT_PUBLIC_CEMITERIO_URL: ${{ vars.NEXT_PUBLIC_CEMITERIO_URL }}
        run: |
          npm ci
          npm run build
          echo "saudeemdado.com" > out/CNAME
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
