# =============================================================================
# CI — o código que está no ar: site/, scripts/, tests/, mcp_server/, clients/
# =============================================================================
# Este workflow não existia. api-ci.yml cobria api/ e frontend-ci.yml cobria
# frontend/ — os dois legados — enquanto o que roda em produção (o site estático
# de saudeemdado.com e os pipelines que alimentam o Supabase) não tinha nenhuma
# verificação automática. Os testes da raiz, incluindo os 112 de tests/pipelines,
# nunca eram executados em lugar nenhum.
#
# Divisão de responsabilidade:
#   ci.yml           → site/, scripts/, tests/, mcp_server/, clients/
#   deploy-site.yml  → publica site/ no GitHub Pages, só em main
#
# api-ci.yml e frontend-ci.yml foram removidos junto com a stack legada, que
# hoje vive em archive/ e não é implantada em lugar nenhum.
# =============================================================================
name: CI

# Dispara em QUALQUER branch, não só em main. O repositório trabalha direto na
# main e nunca abriu um pull request; um CI preso ao gatilho `pull_request`
# simplesmente não rodaria — que é o mesmo defeito dos workflows que este aqui
# veio substituir. Em branch de trabalho ele roda a cada push, e continua
# valendo em PR se o fluxo mudar.
on:
  push:
    paths:
      - "site/**"
      - "scripts/**"
      - "ml/**"
      - "tests/**"
      - "validation/**"
      - "mcp_server/**"
      - "clients/**"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "site/**"
      - "scripts/**"
      - "ml/**"
      - "tests/**"
      - "validation/**"
      - "mcp_server/**"
      - "clients/**"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/ci.yml"
  # Permite rodar sob demanda pela aba Actions, sem precisar de commit.
  # Só aparece na interface depois que o arquivo chega na branch padrão.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Pipelines, validação e clientes ────────────────────────────────────────
  python:
    name: Testes Python (${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # Os pipelines abortam se acharem que estão publicando com chave pública.
      # Nenhum teste desta suíte faz rede; a variável só evita leitura de ambiente.
      SUPABASE_URL: "https://exemplo.invalid"
      SUPABASE_ANON_KEY: "chave-de-teste-sem-valor"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # requirements-test.txt, não requirements.txt: a suíte não importa dbt,
      # prefect, streamlit nem pysus, e arrastá-los custou uma quebra real --
      # dbt-core puxou um beta sem wheel (dbt-core-experimental-parser 2.0.0b1)
      # cuja metadata não compila, derrubando os testes em 3.11 por um motivo
      # sem relação com o código testado. São 68 pacotes em vez de 195.
      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements-test.txt

      # Roda a suite inteira: pipelines, validação, ingestão e ml.
      # Os --ignore de tests/api e test_api_anomalias.py sairam junto com a
      # stack legada — os dois testavam a API FastAPI, hoje em
      # archive/tests-api/ e nao mais executada.
      - name: Pytest
        run: pytest tests/ -v --tb=short

      # Só as regras F (pyflakes): import não usado, variável morta, nome
      # indefinido — coisas que indicam bug. O ruleset completo do pyproject
      # (E/I/N/UP/B/SIM) acusa 153 ocorrências de ESTILO em scripts/, quase
      # todas deliberadas: ponto-e-vírgula nos scripts de análise (83) e nomes
      # maiúsculos de matriz em código numérico (16). Travar o CI nisso seria
      # exigir uma reescrita de estilo que ninguém pediu. Para subir a régua,
      # limpe um grupo de regras por vez e acrescente aqui.
      # `validation` entrou nesta lista em 2026-08: ficava de fora sem motivo, e
      # escondia um import morto de `great_expectations` em run_validations.py.
      # `ingestion` e `flows` continuam FORA, e isso é deliberado — não é
      # descuido: os dois acusam 30 ocorrências F, entre elas cinco F821 (nome
      # indefinido, que viraria NameError em execução) em ingest_all_states.py.
      # É código da arquitetura antiga, que nenhum workflow executa; ligá-lo aqui
      # deixaria o CI vermelho por causa de software que ninguém roda. A decisão
      # sobre arquivar ou consertar está pendente — até lá, o silêncio é
      # declarado, não acidental.
      - name: Ruff — regras de bug (F)
        run: ruff check scripts mcp_server clients validation --select F --output-format=github

      # Garante que o pacote publicado no PyPI ainda importa com as deps do projeto.
      - name: Importar servidor MCP e client Python
        run: |
          python -c "import saudeemdado_mcp; print('mcp ok')"
          python -c "import saudeemdado; print('client ok')"
        env:
          PYTHONPATH: mcp_server:clients/python

  # ── Site publicado ─────────────────────────────────────────────────────────
  site:
    name: Site (type-check & build)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, nao 20: o prebuild (build-static-data.mjs) importa lib/completude.ts
          # direto, e os testes rodam em .mts no runner nativo. Type stripping so
          # existe a partir do Node 22.6, e por padrao do 23 em diante. O Node 20
          # tambem saiu do suporte em abril/2026.
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependências
        working-directory: site
        run: npm ci

      - name: TypeScript type-check
        working-directory: site
        run: npx tsc --noEmit

      - name: Testes do site
        working-directory: site
        run: npm test

      - name: Build estático
        working-directory: site
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      # O build gera site/out; se ele sumir, o deploy-site.yml publicaria vazio.
      - name: Conferir que o export saiu
        working-directory: site
        run: |
          test -d out || { echo "::error::site/out não foi gerado pelo build"; exit 1; }
          PAGINAS=$(find out -name "*.html" | wc -l)
          echo "páginas geradas: $PAGINAS"
          test "$PAGINAS" -ge 20 || { echo "::error::só $PAGINAS páginas; esperado ≥20"; exit 1; }

      # O favicon e a imagem OG são gerados por scripts/gerar_assets_marca.py e
      # versionados. Como não são regerados no build, a única forma de descobrir
      # que sumiram seria alguém compartilhar um link e ver o cartão cinza —
      # que foi exatamente como o problema anterior chegou até aqui.
      - name: Conferir que os ativos de marca estão no export
        working-directory: site
        run: |
          for arquivo in favicon.ico icon.svg opengraph-image.png; do
            test -f "out/$arquivo" || { echo "::error::out/$arquivo não foi exportado"; exit 1; }
          done
          grep -q 'og:image' out/index.html || { echo "::error::index.html sem og:image"; exit 1; }
          echo "favicon, ícone e imagem OG presentes"

  # ── Supply chain ───────────────────────────────────────────────────────────
  # INFORMATIVO, não bloqueante — e a distinção importa.
  #
  # O alerta que sobra hoje no `npm audit` é o do Next.js 14, e ele não é
  # alcançável nesta arquitetura: o site é `output: export`, sem servidor Next,
  # sem middleware e sem Server Action, servido como arquivo estático pelo GitHub
  # Pages. Todos os advisories da lista exigem o runtime de servidor. A correção
  # que o npm oferece é `next@16` — dois majors no único componente que gera as
  # páginas, com risco real de regressão e ganho nulo em produção.
  #
  # Um job bloqueante aqui travaria a main indefinidamente por um risco que não
  # existe, e o desfecho previsível seria alguém desligar o job. Informativo, ele
  # continua mostrando quando aparece algo NOVO — que é o que se quer vigiar.
  # A análise completa está em docs/SECURITY_AUDIT.md.
  supply-chain:
    name: Supply chain (informativo)
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: npm audit
        working-directory: site
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high || true
          echo "--- resumo ---"
          npm audit --json 2>/dev/null \
            | python3 -c 'import sys,json; m=json.load(sys.stdin).get("metadata",{}).get("vulnerabilities",{}); print(m)' || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: pip-audit
        run: |
          pip install --upgrade pip pip-audit
          pip install -r requirements-test.txt
          pip-audit --desc --strict || true
