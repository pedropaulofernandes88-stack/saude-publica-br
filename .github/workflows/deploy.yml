# ============================================================
# deploy.yml — CI/CD do stack legado: testa, depois deploia
# API → Railway  |  Frontend (frontend/) → Vercel
# ============================================================
# NÃO é isto que publica saudeemdado.com. O site em produção é o estático de
# site/, publicado no GitHub Pages por deploy-site.yml. Este workflow cuida do
# par api/ + frontend/, que continua no repositório.
#
# Só dispara quando api/ ou frontend/ mudam. Antes rodava a CADA push em main,
# inclusive nos que só tocavam site/ ou scripts/ — gastando duas execuções de
# deploy e podendo falhar por causa de código que não tem relação com o que
# está sendo publicado.
# ============================================================
name: 🚀 Deploy — API e frontend legado

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "frontend/**"
      - "ml/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:   # permite trigger manual no GitHub

jobs:
  # ── Testes ────────────────────────────────────────────────────────────────
  test:
    name: ✅ Testes (27 API + validação)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            api/requirements*.txt

      # api/requirements.txt faltava aqui: as versões fixadas da API (asyncpg,
      # redis, instrumentator) só existem nele. Sem ele, o teste roda contra um
      # conjunto de dependências diferente do que vai para o Railway.
      - name: Instalar dependências
        run: pip install -r requirements.txt -r api/requirements.txt -r api/requirements-dev.txt

      - name: Rodar testes da API
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/api/ tests/test_api_anomalias.py -q --tb=short
        env:
          DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"
          REDIS_URL: "redis://localhost:6379/0"
          API_SECRET_KEY: "test-secret-key-32-chars-minimum!!"
          JWT_SECRET_KEY: "test-jwt-key-32-chars-minimum!!!!"

  # ── Deploy API no Railway ──────────────────────────────────────────────────
  deploy-api:
    name: 🚂 Deploy API → Railway
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy no Railway
        run: railway up --service api --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ── Deploy Frontend no Vercel ──────────────────────────────────────────────
  deploy-frontend:
    name: ▲ Deploy Frontend → Vercel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sem `cache: npm`: ele exige um lockfile, e não existe frontend/package-lock.json.
      # O passo falhava antes mesmo de chegar ao Vercel.
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Vercel CLI
        run: npm install -g vercel

      - name: Deploy no Vercel (preview → produção)
        run: |
          cd frontend
          vercel --token ${{ secrets.VERCEL_TOKEN }} \
                 --yes \
                 --prod \
                 -e NEXT_PUBLIC_API_BASE_URL=https://saudeemdado.com/api
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── Notificação final ──────────────────────────────────────────────────────
  notify:
    name: 📢 Status do deploy
    needs: [deploy-api, deploy-frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Resumo
        run: |
          echo "## Deploy concluído" >> $GITHUB_STEP_SUMMARY
          echo "| Serviço | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API (Railway) | ${{ needs.deploy-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (Vercel) | ${{ needs.deploy-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://saudeemdado.com |" >> $GITHUB_STEP_SUMMARY
