# =============================================================================
# API CI — lint, tipos e testes da API FastAPI (api/)
# =============================================================================
# Os testes vivem em tests/api/ NA RAIZ, não em api/tests/. Rodar com
# `working-directory: api` apontava para um diretório inexistente; o passo nunca
# executou teste nenhum. Aqui o pytest roda da raiz, que é onde tests/conftest.py
# está — e é dele que vêm os mocks de asyncpg e Redis.
#
# NÃO há serviço Postgres: tests/api/ mocka o pool e o Redis por fixture, então
# nenhum teste toca banco. O passo antigo subia postgres:15-alpine e aplicava as
# migrations sem ON_ERROR_STOP, o que escondia falhas — várias migrations usam
# papéis (anon, authenticated, service_role) e objetos (storage.objects) que só
# existem no Supabase e quebram no Postgres puro. Um check de migrations é útil,
# mas precisa do andaime do Supabase; não cabe carona neste workflow.
# =============================================================================
name: API CI

on:
  push:
    paths:
      - "api/**"
      - "tests/api/**"
      - "tests/test_api_anomalias.py"
      - "tests/conftest.py"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "api/**"
      - "tests/api/**"
      - "tests/test_api_anomalias.py"
      - "tests/conftest.py"
      - ".github/workflows/api-ci.yml"

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # A API lê estas variáveis na importação; os testes não abrem conexão.
      DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock"
      REDIS_URL: "redis://localhost:6379/0"
      API_SECRET_KEY: "test-secret-key-32-chars-minimum!!"
      JWT_SECRET_KEY: "test-jwt-key-32-chars-minimum!!!!"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: api/requirements*.txt

      # SO os requirements da API. Puxar o requirements.txt da raiz junto torna o
      # conjunto insatisfazivel: ele traz pysus, cujas versoes exigem ou
      # pydantic>=2.12.5 (e a API fixa pydantic==2.10.3) ou tqdm==4.64.0 (e a
      # raiz pede tqdm>=4.66.0). Nenhuma combinacao serve as duas.
      # O unico pacote da raiz que os testes precisavam era pandas, usado pelas
      # fixtures de tests/conftest.py -- ele foi para api/requirements-dev.txt.
      # De quebra, sao 48 pacotes em vez de 195.
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r api/requirements.txt -r api/requirements-dev.txt

      # Só as regras F (pyflakes). Este passo nunca tinha rodado -- o workflow
      # apontava para um diretório inexistente e depois foi desligado -- e na
      # primeira execução real acusou 341 erros. Entre eles havia UM bug de
      # verdade: `uuid4` usado sem import em routers/dashboards.py, ou seja,
      # NameError e 500 em POST /dashboards sem slug. Corrigido, junto com os
      # outros 25 de F (imports mortos, f-string sem placeholder).
      #
      # Os 315 restantes são estilo, e dois grupos não deveriam nem ser erro
      # aqui: 129 de B008 (function-call-in-default-argument) são o
      # `Depends()` do FastAPI, que é a forma correta de escrever a
      # dependência; e 145 de UP045 são `Optional[X]` em vez de `X | None`.
      # Travar o CI nisso exigiria uma reescrita que ninguém pediu.
      - name: Ruff — regras de bug (F)
        working-directory: api
        run: ruff check . --select F --output-format=github

      # Formatação e mypy ficam informativos: nunca rodaram, e a dívida
      # acumulada não tem relação com a mudança que dispara o CI.
      - name: Ruff format check
        working-directory: api
        continue-on-error: true
        run: ruff format --check .

      - name: mypy type check
        working-directory: api
        continue-on-error: true
        run: mypy . --ignore-missing-imports --no-error-summary

      # test_api_anomalias.py importa a app FastAPI, então só roda com as deps
      # de api/ instaladas — por isso vive aqui e não no ci.yml.
      - name: Pytest
        run: |
          pytest tests/api/ tests/test_api_anomalias.py \
            -v \
            --tb=short \
            --cov=api \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: api
          fail_ci_if_error: false
